name: Publish verified Autoware Partition images

on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: Immutable snapshot shared by both native builds (main-YYYYMMDD-<shortsha>)
        required: true
        type: string
      release_tag:
        description: Existing annotated Git release tag on the same commit
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-adsw-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate, assemble, and publish
        env:
          IMAGE_NAMESPACE: ghcr.io/oss-test-group
          LEGACY_REPOSITORY: ghcr.io/oss-test-group/autoware-partition
          RELEASE_TAG: ${{ inputs.release_tag }}
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
        shell: bash
        run: |
          set -euo pipefail
          ./release/publish-ghcr.sh
