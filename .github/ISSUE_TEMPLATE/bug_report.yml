name: Bug report
description: Autoware Partition 실행 또는 빌드 문제를 등록합니다.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        재현에 필요한 환경과 로그를 함께 작성해 주세요.
  - type: dropdown
    id: architecture
    attributes:
      label: 실행 환경
      options:
        - AMD64 Ubuntu PC
        - ARM64 BSP board
        - BSP board and remote RViz PC
        - Other
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: Docker 이미지
      description: 사용한 전체 이미지 이름 또는 digest를 입력해 주세요.
      placeholder: ghcr.io/oss-test-group/autoware-partition:adsw-perception
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 문제 설명
      description: 기대한 동작과 실제 동작을 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 실행한 명령과 문제 발생 순서를 작성해 주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 관련 로그
      description: 개인정보와 인증정보를 제거한 로그를 첨부해 주세요.
      render: shell
